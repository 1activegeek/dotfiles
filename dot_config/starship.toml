# Starship prompt configuration
# https://starship.rs/config/
#
# Catppuccin Mocha color scheme
# Context-aware: shows K8s, AWS, Azure only when relevant

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$kubernetes\
$aws\
$azure\
$terraform\
$docker_context\
$python\
$nodejs\
$golang\
$rust\
$cmd_duration\
$line_break\
$character"""

# ============================================
# Core
# ============================================
[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol   = "[❯](bold #f38ba8)"
vimcmd_symbol  = "[❮](bold #a6e3a1)"

[directory]
style             = "bold #89b4fa"
truncation_length = 4
truncation_symbol = "…/"
read_only         = " 🔒"

[username]
show_always = false
style_user  = "#cba6f7"
style_root  = "bold #f38ba8"
format      = "[$user]($style) "

[hostname]
ssh_only = true
style    = "#fab387"
format   = "[@$hostname]($style) "

# ============================================
# Git
# ============================================
[git_branch]
symbol = " "
style  = "#cba6f7"
format = "[$symbol$branch]($style) "

[git_status]
style   = "#f38ba8"
format  = '([\[$all_status$ahead_behind\]]($style) )'
ahead   = "⇡${count}"
behind  = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
staged   = "[+${count}](green)"
modified = "[!${count}](yellow)"
deleted  = "[-${count}](red)"
untracked = "[?${count}](blue)"

# ============================================
# Kubernetes
# ============================================
[kubernetes]
disabled = false
style    = "#89dceb"
format   = "[$symbol$context( \\($namespace\\))]($style) "
symbol   = "☸ "
# Only show k8s context when KUBECONFIG is set or in k8s-related dirs
detect_env_vars = ["KUBECONFIG"]

# ============================================
# Cloud
# ============================================
[aws]
disabled = true   # Enable per-session: export AWS_DEFAULT_REGION or use profiles
symbol   = " "
style    = "#fab387"
format   = '[$symbol($profile )(\($region\) )]($style)'

[azure]
disabled = true   # Enable per-session: set AZURE_CONFIG_DIR
symbol   = "󰠅 "
style    = "#89b4fa"
format   = '[$symbol($subscription)]($style) '

[terraform]
disabled = false
style    = "#cba6f7"
format   = "[$symbol$workspace]($style) "
symbol   = "󱁢 "

# ============================================
# Languages (auto-detected)
# ============================================
[python]
symbol = " "
style  = "#f9e2af"
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style  = "#a6e3a1"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style  = "#89dceb"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style  = "#fab387"
format = "[$symbol($version )]($style)"

[docker_context]
symbol   = " "
style    = "#89b4fa"
format   = "[$symbol$context]($style) "
disabled = false
# Only show when DOCKER_CONTEXT is not 'default'
only_with_files = false

# ============================================
# Performance
# ============================================
[cmd_duration]
min_time    = 2000   # Show if command took > 2 seconds
style       = "#a6adc8"
format      = "[⏱ $duration]($style) "
show_milliseconds = false
