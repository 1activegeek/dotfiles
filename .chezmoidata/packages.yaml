# packages.yaml - YAML-driven package catalog for chezmoi
# Replaces Brewfile + package-catalog.sh from bootstrap-mac-os.
#
# Packages without a `profiles` key install on ALL profiles.
# profiles: [personal] = personal/homelab only
# profiles: [work]     = work machines only
#
# This catalog is kept as a strict mirror of the gold machine's
# installed-on-request set. `brew bundle cleanup --force` (run by
# 03-brew-bundle) removes anything NOT listed here on apply.

