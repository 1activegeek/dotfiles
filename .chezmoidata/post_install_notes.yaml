post_install_notes:
  - category: "Raycast"
    items:
      - "Settings > Advanced > Import — restore settings backup"
      - "Re-enable extensions after import (some require re-auth)"

  - category: "VS Code"
    items:
      - "Settings Sync — sign in with GitHub to restore extensions/settings"

  - category: "Ghostty"
    items:
      - "Managed by chezmoi (~/.config/ghostty/config) — no action needed"

  - category: "Zellij"
    items:
      - "Managed by chezmoi (~/.config/zellij/config.kdl) — no action needed"

  - category: "Atuin"
    items:
      - "Run: atuin login — to sync shell history across machines"

  - category: "1Password"
    items:
      - "Verify SSH agent: ssh -T git@github.com"
      - "CLI integration must be enabled: Settings > Developer > CLI"

  - category: "Slack"
    items:
      - "File > Sign into another workspace for each workspace"

  - category: "Discord"
    items:
      - "Sign in — servers rejoin automatically"

  - category: "Obsidian"
    items:
      - "Open vault from iCloud Drive — wait for full sync before opening"
      - "Verify community plugins re-enable correctly after vault open"

  - category: "Home Assistant"
    items:
      - "Sign in — companion app links to existing instance automatically"

  - category: "Tailscale"
    items:
      - "Sign in and verify homelab nodes are reachable"

  - category: "Security Tools"
    items:
      - "LuLu, BlockBlock, KnockKnock — grant Full Disk Access in System Settings > Privacy"
      - "These will prompt on first launch — approve each one"

  - category: "SSH Keys"
    items:
      - "Keys used with IdentityAgent none (explicit file on disk) MUST be exported."
      - "Keys for personal servers use the 1Password agent — no export needed."
      - ""
      - "First, confirm your 1Password item names:"
      - "  op item list --vault Private --categories 'SSH Key'"
      - ""
      - "── id_github (GitHub) ──"
      - "  op read 'op://Private/id_github/private key' > ~/.ssh/id_github"
      - "  op read 'op://Private/id_github/public key'  > ~/.ssh/id_github.pub"
      - "  chmod 600 ~/.ssh/id_github && chmod 644 ~/.ssh/id_github.pub"
      - "  ssh -T git@github.com   # should say: Hi 1activegeek!"
      - ""
      - "── id_gitea (self-hosted Gitea) ──"
      - "  op read 'op://Private/id_gitea/private key' > ~/.ssh/id_gitea"
      - "  op read 'op://Private/id_gitea/public key'  > ~/.ssh/id_gitea.pub"
      - "  chmod 600 ~/.ssh/id_gitea && chmod 644 ~/.ssh/id_gitea.pub"
      - "  ssh -T git@git.thegeekybits.com"
      - ""
      - "── id_ed25519 (personal servers) ──"
      - "  op read 'op://Private/id_ed25519/private key' > ~/.ssh/id_ed25519"
      - "  op read 'op://Private/id_ed25519/public key'  > ~/.ssh/id_ed25519.pub"
      - "  chmod 600 ~/.ssh/id_ed25519 && chmod 644 ~/.ssh/id_ed25519.pub"
      - "  ssh atlantis   # verify homelab access"
      - ""
      - "── Generate a brand new key and store in 1Password ──"
      - "  ssh-keygen -t ed25519 -C 'your@email.com' -f ~/.ssh/id_newkey"
      - "  op item create --category 'SSH Key' --title 'id_newkey' --vault Private \\"
      - "    'private key[concealed]=$(cat ~/.ssh/id_newkey)' \\"
      - "    'public key=$(cat ~/.ssh/id_newkey.pub)'"
      - "  Then add the public key to GitHub/Gitea via their web UI."
      - ""
      - "Note: Replace 'id_github' etc. with the exact item title shown by op item list."

  - category: "Symlinks"
    items:
      - "Create ~/projects → iCloud 1 Projects:"
      - "  ln -s ~/Library/Mobile\\ Documents/com~apple~CloudDocs/Documents/1\\ Projects ~/projects"
